<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F6;--card:#FFFFFF;--slate:#435467;--slate-2:#55697E;--slate-3:#6B7E93;--ink:#2D3A4A;--muted:#8A97A8;--line:#E8EDF3;
  --soft:#F6F8FB;--yellow:#F3C46B;--yellow-soft:#FFF6E3;--red:#E5566C;--red-soft:#FDECEF;--cyan:#4CC3E0;--cyan-soft:#E6F7FB;
  --green:#3DBE8B;--green-soft:#E5F7EF;--radius:18px;--shadow:0 6px 24px rgba(45,58,74,.06)
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--slate)}
.app{display:flex;gap:24px;padding:24px;min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{width:248px;flex-shrink:0;background:var(--slate);border-radius:var(--radius);padding:26px 16px;display:flex;flex-direction:column;position:sticky;top:24px;height:calc(100vh - 48px);overflow:auto}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:21px;letter-spacing:.5px;padding:0 10px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:18px}
.logo small{display:block;font-size:10px;font-weight:500;letter-spacing:.3px;opacity:.65;margin-top:2px}
.nav-group{color:rgba(255,255,255,.45);font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:14px 14px 6px}
.nav{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;color:rgba(255,255,255,.88);padding:12px 14px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:500;text-align:left;transition:.15s}
.nav svg{width:21px;height:21px;flex-shrink:0}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.active{background:#fff;color:var(--slate);font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sidebar .spacer{flex:1;min-height:20px}
.sidebar .ver{color:rgba(255,255,255,.4);font-size:11px;padding:10px 14px 0}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:24px}
.topbar{background:var(--card);border-radius:var(--radius);padding:20px 30px;display:flex;align-items:center;gap:24px;box-shadow:var(--shadow)}
.topbar h1{margin:0;font-size:28px;font-weight:700;color:var(--slate);white-space:nowrap}
.menu-btn{display:none;border:0;background:var(--soft);border-radius:10px;width:40px;height:40px;cursor:pointer}
.search{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:0 14px;height:46px;max-width:760px;margin-left:auto;background:#fff}
.search svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;font-size:14px}
.search input::placeholder{color:#A7B2C0}
.icon-btn{position:relative;border:0;background:transparent;cursor:pointer;color:var(--slate);width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.icon-btn:hover{background:var(--soft)}
.icon-btn svg{width:22px;height:22px}
.badge-dot{position:absolute;top:3px;right:3px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--slate);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0;cursor:default}
.user-meta{line-height:1.3;white-space:nowrap}
.user-meta b{display:block;font-size:13px}.user-meta span{font-size:11px;color:var(--muted)}

/* ---------- Cards & grid ---------- */
.card{background:var(--card);border-radius:var(--radius);padding:24px 28px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.card-head h2{margin:0;font-size:19px;font-weight:600;color:var(--ink)}
.card-head .sub{color:var(--muted);font-size:12px;margin-top:3px}
.grid{display:grid;gap:24px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2.15fr) minmax(300px,1fr)}
.g-bottom{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

.stat{display:flex;align-items:center;gap:20px;padding:24px 26px}
.stat .ic{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.stat .ic svg{width:30px;height:30px}
.stat .lbl{color:var(--muted);font-size:14px}
.stat .val{font-size:28px;font-weight:700;color:var(--slate);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.ic.blue{background:var(--cyan-soft);color:#2A9CBA}.ic.yellow{background:var(--yellow-soft);color:#D49A2A}.ic.red{background:var(--red-soft);color:var(--red)}.ic.green{background:var(--green-soft);color:#249A6C}.ic.slate{background:#EBEFF4;color:var(--slate)}

/* ---------- Filters / forms ---------- */
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.field input,.field select,.field textarea,.select{border:1px solid var(--line);border-radius:10px;height:42px;padding:0 12px;background:#fff;color:var(--ink);font-size:14px;font-weight:500;outline:none;min-width:0}
.field textarea{height:auto;padding:10px 12px;min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--slate-3);box-shadow:0 0 0 3px rgba(67,84,103,.08)}
.select.pill{border-color:#F6D9A5;color:var(--ink);height:38px;border-radius:10px;font-weight:600}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.form-grid .span-2{grid-column:span 2}.form-grid .span-all{grid-column:1/-1}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;background:var(--slate);color:#fff;font-weight:600;height:42px;padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:#3A495A}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.btn.ghost{background:var(--soft);color:var(--slate)}.btn.ghost:hover{background:#E9EEF4}
.btn.yellow{background:var(--yellow);color:#4A3A12}.btn.yellow:hover{background:#EDB651}
.btn.red{background:var(--red)}.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.white{background:#fff;color:var(--slate)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--slate)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 18px;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:var(--slate);border-bottom-color:var(--slate)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:9px 16px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.active{background:#fff;color:var(--slate);box-shadow:0 2px 8px rgba(0,0,0,.06)}

/* ---------- Tables ---------- */
.table-wrap{overflow:auto;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{color:var(--muted);font-size:11.5px;font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0}
table.t td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tbody tr.click{cursor:pointer}table.t tbody tr.click:hover{background:var(--soft)}
table.t tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--soft)}
.muted{color:var(--muted)}.small{font-size:12px}.strong{font-weight:700}
.red-t{color:var(--red)}.green-t{color:#249A6C}.yellow-t{color:#D49A2A}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)}.chip.green{background:var(--green-soft);color:#249A6C}.chip.yellow{background:var(--yellow-soft);color:#B07A16}.chip.slate{background:#EBEFF4;color:var(--slate)}.chip.cyan{background:var(--cyan-soft);color:#2A8BA6}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px;min-width:90px}
.bar>i{display:block;height:100%;background:var(--red);border-radius:4px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.person{display:flex;align-items:center;gap:12px}.person b{font-weight:600;display:block}.person small{color:var(--muted);font-size:11px}

/* ---------- Charts ---------- */
.legend{display:flex;gap:18px;align-items:center;font-size:13px;color:var(--ink)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.chart{width:100%;height:280px}
.chart text{font-family:inherit;fill:var(--muted);font-size:12px}
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.donut-stats{display:flex;gap:36px;text-align:center}
.donut-stats .lbl{color:var(--muted);font-size:12.5px}.donut-stats .v{font-size:24px;font-weight:700;margin-top:4px}
.mix-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:12px}
.mix-row .bar{margin-top:6px}

/* ---------- CTA card ---------- */
.cta{background:var(--slate);color:#fff;position:relative;overflow:hidden;min-height:200px}
.cta h3{margin:0;font-size:21px;font-weight:600;line-height:1.45;max-width:78%}
.cta p{opacity:.75;font-size:13px;max-width:70%}
.cta .arc{position:absolute;right:-30px;bottom:-40px;width:190px;height:190px;pointer-events:none}

/* ---------- Students page ---------- */
.split{display:grid;grid-template-columns:minmax(330px,430px) minmax(0,1fr);gap:24px;align-items:start}
.list-card{padding:22px 0 8px}
.list-card .card-head,.list-card .list-tools{padding:0 24px}
.list-tools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.list-tools .row{display:flex;gap:8px}
.list-tools .row>*{flex:1;min-width:0}
.student-list{max-height:calc(100vh - 330px);overflow:auto}
.srow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);cursor:pointer}
.srow:hover{background:var(--soft)}
.srow.active{background:var(--slate);color:#fff}.srow.active small,.srow.active .muted{color:rgba(255,255,255,.7)}
.srow b{font-weight:600;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow small{font-size:11px;color:var(--muted)}
.srow .amt{text-align:right;font-size:12.5px;font-weight:600;white-space:nowrap}
.profile-head{background:var(--slate);color:#fff;border-radius:var(--radius) var(--radius) 0 0;padding:28px 32px;display:flex;align-items:center;gap:24px;position:relative;overflow:hidden}
.profile-head .big-av{width:100px;height:100px;border-radius:50%;background:#fff;color:var(--slate);display:grid;place-items:center;font-size:34px;font-weight:800;border:4px solid rgba(255,255,255,.25);flex-shrink:0}
.profile-head h2{margin:0;font-size:28px;font-weight:700}
.profile-head .meta{opacity:.85;margin-top:8px;font-weight:500}
.profile-head .arc{position:absolute;right:-20px;top:-10px;width:180px;height:180px;opacity:.95}
.profile-body{background:#fff;border-radius:0 0 var(--radius) var(--radius);padding:24px 32px 30px;box-shadow:var(--shadow)}
.details{border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-bottom:22px}
.details h3{margin:0 0 16px;font-size:18px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 24px}
.kv .k{color:var(--muted);font-size:12.5px}.kv .v{font-weight:600;margin-top:5px;overflow-wrap:anywhere}
.money-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.mcard{border-radius:14px;padding:14px 16px}.mcard .k{font-size:12px;color:var(--muted)}.mcard .v{font-size:17px;font-weight:700;margin-top:4px;white-space:nowrap}
.inv{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.inv-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;background:var(--soft);cursor:pointer;flex-wrap:wrap}
.inv-b{padding:4px 12px 10px;display:none}.inv.open .inv-b{display:block}
.qr-box{display:flex;gap:20px;align-items:center;border:1px dashed var(--yellow);background:#FFFCF5;border-radius:14px;padding:16px;margin-bottom:22px;flex-wrap:wrap}
.qr-box img{width:150px;height:150px;border-radius:8px;background:#fff}

/* ---------- Misc ---------- */
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.notice{border-radius:14px;background:var(--cyan-soft);color:#24617A;padding:14px 18px;line-height:1.6;font-size:13px}
.notice.warn{background:var(--yellow-soft);color:#7C5A12}.notice.red{background:var(--red-soft);color:#9B2C3D}
.toast{position:fixed;right:24px;bottom:24px;z-index:60;max-width:440px;padding:14px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.15);font-weight:500;line-height:1.5}
.toast.success{background:#1F7A57;color:#fff}.toast.error{background:var(--red);color:#fff}
/* Lưu "ngầm": chỉ hiện nhãn nhỏ phía trên, không che màn hình */
.busy{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:70;pointer-events:none}
.busy .box{background:var(--slate);color:#fff;border-radius:999px;padding:8px 16px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(45,58,74,.25)}
.busy .spinner{width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,.35);border-top-color:#fff}
.spinner{width:22px;height:22px;border:3px solid #DCE3EB;border-top-color:var(--slate);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-bg{position:fixed;inset:0;background:rgba(45,58,74,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:var(--radius);width:100%;max-width:760px;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal.wide{max-width:980px}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-h h3{margin:0;font-size:19px}
.hidden{display:none!important}
.sale-lines .line{display:grid;grid-template-columns:minmax(0,2.4fr) 90px 140px 130px 40px;gap:10px;align-items:end;margin-bottom:10px}
.sum-box{background:var(--soft);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sum-box .v{font-size:24px;font-weight:800;color:var(--slate)}
#rTable td:not(.num){min-width:110px}
.report-meta{color:var(--muted);font-size:12px;margin:-8px 0 14px}
.scrim{display:none}
.kid-card{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:#fff}
.kid-card:hover{background:var(--soft)}.kid-card.on{border-color:var(--slate);box-shadow:0 0 0 2px rgba(67,84,103,.15)}
.kid-card b{display:block;font-size:14px}.kid-card small{display:block;color:var(--muted);font-size:11.5px}
.chat-fab{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;border:0;background:var(--slate);color:#fff;box-shadow:0 10px 28px rgba(45,58,74,.35);cursor:pointer;z-index:55;display:grid;place-items:center}
.chat-fab .badge-dot{top:2px;right:2px}
.chat-panel{position:fixed;right:24px;bottom:92px;width:380px;max-width:calc(100vw - 24px);height:560px;max-height:calc(100vh - 120px);background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(45,58,74,.25);z-index:56;display:flex;flex-direction:column;overflow:hidden}
.chat-head{background:var(--slate);color:#fff;padding:12px 10px 12px 18px;display:flex;align-items:center;gap:4px}.chat-head b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-list{flex:1;overflow:auto}
.chat-search{padding:10px 12px;border-bottom:1px solid var(--line)}
.chat-group{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:10px 16px 4px}
.chat-contact{display:flex;gap:10px;align-items:center;padding:10px 16px;cursor:pointer;border-bottom:1px solid #F3F5F8}
.chat-contact:hover{background:var(--soft)}.chat-contact .meta{flex:1;min-width:0}.chat-contact b{font-size:13.5px;display:block}
.chat-contact small{color:var(--muted);font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-unread{background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:2px 7px}
.chat-conv{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#F6F8FB}
.chat-msg{max-width:78%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.chat-msg.me{align-self:flex-end;background:var(--slate);color:#fff;border-bottom-right-radius:4px}
.chat-msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-msg small{display:block;font-size:10.5px;opacity:.65;margin-top:3px}
.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.chat-input textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 12px;resize:none;max-height:120px;font:inherit;outline:none}
.toast{bottom:92px}
.alert-item{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.alert-item:hover{background:var(--soft)}.alert-item .dot{margin-top:6px;flex-shrink:0}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;display:block;background:var(--soft)}
.empty-thumb{background:repeating-linear-gradient(45deg,#F1F4F8,#F1F4F8 6px,#E8EDF3 6px,#E8EDF3 12px)}
.shop-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;margin-bottom:4px;background:var(--soft)}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#EEF2F6 0%,#DDE5EE 100%)}
.auth-card{background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(45,58,74,.12);padding:34px 34px 30px;width:100%;max-width:430px}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:26px}.auth-logo b{font-size:22px;color:var(--slate);letter-spacing:.5px;display:block}.auth-logo small{color:var(--muted);font-size:11px}
.child-pill{border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff;font-weight:600;cursor:pointer}.child-pill.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.shop-item{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.shop-item .p{font-weight:800;color:var(--slate);font-size:16px}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--soft);font-weight:700;cursor:pointer}.qty input{width:52px;text-align:center}
.month-picker{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.mp-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mp-chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;min-width:74px;text-align:center}
.mp-chip small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.mp-chip.on{background:var(--slate);border-color:var(--slate);color:#fff}.mp-chip.on small{color:rgba(255,255,255,.7)}
.mp-quick{border:0;background:var(--soft);color:var(--slate);border-radius:9px;padding:7px 12px;font-weight:600;font-size:12.5px;cursor:pointer}
.mp-quick:hover{background:#E6EBF1}
.mp-sum{font-size:12.5px;color:var(--muted);font-weight:500}
.pol-pick{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px}
.pol-pick label{display:flex;gap:10px;align-items:flex-start;font-weight:500;color:var(--ink);font-size:13px;cursor:pointer}
.pol-pick input{margin-top:3px;width:16px;height:16px;accent-color:var(--slate)}
.picker{position:relative}
.picker input{width:100%}
.picker-list{position:absolute;left:0;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(45,58,74,.12);max-height:300px;overflow:auto;z-index:30}
.picker-list div{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:500;color:var(--ink)}
.picker-list div:hover,.picker-list div.hl{background:var(--soft)}
.picker-list small{color:var(--muted);font-weight:500}

@media print{
  .sidebar,.topbar,.no-print,.toast,.busy{display:none!important}
  .app{padding:0}.card{box-shadow:none;padding:0}
  body{background:#fff}
  table.t th{position:static}
}
@media(max-width:1280px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main,.g-bottom{grid-template-columns:1fr}.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1024px){
  .app{padding:16px;gap:16px}
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:auto;border-radius:0 var(--radius) var(--radius) 0;z-index:45;transform:translateX(-105%);transition:.2s}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:44}
  .menu-btn{display:grid;place-items:center}
  .split{grid-template-columns:1fr}.student-list{max-height:420px}
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .money-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .user-meta{display:none}
}
@media(max-width:640px){
  .app{padding:12px}.main{gap:16px}.grid{gap:16px}
  .topbar{padding:14px 16px;gap:10px;flex-wrap:wrap}.topbar h1{font-size:21px}
  .search{order:5;flex-basis:100%;max-width:none}
  .card{padding:18px 16px}.stat{padding:18px}.stat .val{font-size:22px}.stat .ic{width:50px;height:50px}
  .g-4,.g-3,.g-2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}.form-grid .span-2{grid-column:auto}
  .kv{grid-template-columns:1fr 1fr}.profile-head{padding:20px;gap:14px}.profile-head .big-av{width:64px;height:64px;font-size:22px}.profile-head h2{font-size:21px}
  .profile-body{padding:18px 16px}
  .sale-lines .line{grid-template-columns:1fr 1fr}
  .toast{left:12px;right:12px;bottom:12px}
}

/* ===== HERO BANNER TRANG PHỤ HUYNH (xanh dương – trắng – vàng gold) ===== */
.hero{--h-blue:#0B5ED7;--h-navy:#0A1F44;--h-gold:#C99A2E;--h-gold2:#E2BC5A;--h-sub:#3E4C66;position:relative;border-radius:24px;overflow:hidden;margin-bottom:22px;
  background:linear-gradient(120deg,#F4F8FF 0%,#E3EEFF 45%,#0B5ED7 100%);min-height:440px;isolation:isolate;box-shadow:0 18px 40px -24px rgba(10,31,68,.45)}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:right center;z-index:-2}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.9) 34%,rgba(255,255,255,.35) 58%,rgba(255,255,255,0) 72%)}
.hero.no-img .hero-deco{position:absolute;right:-80px;top:-60px;width:520px;height:520px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),conic-gradient(from 200deg,#0B5ED7,#3D8BFF,#0A3A8C,#0B5ED7)}
.hero.no-img .hero-deco::after{content:"";position:absolute;left:90px;bottom:70px;width:160px;height:160px;border-radius:50%;border:2px solid rgba(226,188,90,.8)}
.hero-in{position:relative;padding:46px 52px 150px;max-width:640px}
.hero-brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}.hero-brand .brand-logo{width:54px;height:54px}
.hero-eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--h-navy)}
.hero h1{margin:0;font-size:clamp(30px,4.2vw,54px);line-height:1.06;font-weight:800;color:var(--h-navy);letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{display:block;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;color:var(--h-gold);letter-spacing:0;margin-top:4px;
  background:linear-gradient(90deg,var(--h-gold),var(--h-gold2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p.hero-desc{margin:18px 0 0;color:var(--h-sub);font-size:15px;line-height:1.7;max-width:520px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.hero-btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
.hero-btn.pri{background:linear-gradient(135deg,#0A3A8C,var(--h-blue));color:#fff;box-shadow:0 10px 22px -10px rgba(11,94,215,.8)}
.hero-btn.sec{background:rgba(255,255,255,.85);color:var(--h-navy);border:1.5px solid var(--h-blue)}
.hero-btn:hover{transform:translateY(-2px)}.hero-btn.pri:hover{box-shadow:0 14px 26px -10px rgba(11,94,215,.9)}
.hero-btn svg{width:18px;height:18px}
.hero-btn .play{width:24px;height:24px;border-radius:50%;background:var(--h-blue);display:grid;place-items:center}.hero-btn .play svg{width:10px;height:10px;fill:#fff;stroke:none}
.hero-tag{position:absolute;right:46px;bottom:160px;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:30px;line-height:1.15;color:#fff;
  text-shadow:0 2px 12px rgba(10,31,68,.45);transform:rotate(-8deg);text-align:right;max-width:260px}
.hero-tag::after{content:"";display:block;height:3px;margin:8px 0 0 auto;width:70%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--h-gold2))}
.hero-stats{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:46px 46px 0 0;display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));padding:22px 28px 20px}
.hero-stat{display:flex;gap:14px;align-items:center;padding:0 18px;min-width:0}
.hero-stat+.hero-stat{border-left:1px solid #E3E9F2}
.hero-stat svg{width:36px;height:36px;flex-shrink:0;stroke:var(--h-navy);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hero-stat b{display:block;font-size:24px;font-weight:800;color:var(--h-navy);line-height:1.1;font-variant-numeric:tabular-nums}
.hero-stat small{display:block;font-size:12.5px;color:#5B6B85;line-height:1.4;margin-top:2px}
.hero-edit{position:absolute;top:14px;right:14px;z-index:2}
@media (max-width:900px){.hero-stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:16px}.hero-stat:nth-child(3){border-left:0}.hero-in{padding-bottom:210px}.hero-tag{display:none}}
@media (max-width:640px){
  .hero{min-height:0;border-radius:20px}
  .hero{display:flex;flex-direction:column;background:#fff}
  .hero::before{display:none}
  .hero-bg{position:relative;inset:auto;height:210px;z-index:0;background-position:center 30%}
  .hero.no-img{background:linear-gradient(160deg,#F4F8FF 0%,#E3EEFF 60%,#CFE1FF 100%)}.hero.no-img .hero-deco{width:300px;height:300px;right:-120px;top:-120px;opacity:.6}
  .hero-in{padding:22px 22px 24px}.hero-cta{gap:10px}.hero-btn{height:44px;padding:0 18px;font-size:13px}
  .hero-stats{position:static;border-radius:28px 28px 0 0;padding:18px 14px}.hero-stat{padding:0 8px;gap:10px}.hero-stat svg{width:28px;height:28px}.hero-stat b{font-size:20px}
}
@media (prefers-reduced-motion:reduce){.hero-btn{transition:none}.hero-btn:hover{transform:none}}
.banner-grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1100px){.banner-grid{grid-template-columns:minmax(0,1fr)}}
.stat-row{display:grid;grid-template-columns:110px 90px minmax(0,1fr);gap:8px;margin-bottom:8px}
/* Xem trước điện thoại trong trang chỉnh banner */
.hero.hero-mobile{min-height:0;border-radius:20px}
.hero.hero-mobile{display:flex;flex-direction:column;background:#fff}.hero.hero-mobile::before{display:none}
.hero.hero-mobile .hero-bg{position:relative;inset:auto;height:190px;z-index:0;background-position:center 30%}
.hero.hero-mobile.no-img{background:linear-gradient(160deg,#F4F8FF 0%,#E3EEFF 60%,#CFE1FF 100%)}.hero.hero-mobile.no-img .hero-deco{width:300px;height:300px;right:-120px;top:-120px;opacity:.6}
.hero.hero-mobile .hero-in{padding:26px 20px 22px}.hero.hero-mobile h1{font-size:30px}.hero.hero-mobile .hero-tag{display:none}
.hero.hero-mobile .hero-btn{height:42px;padding:0 16px;font-size:13px}
.hero.hero-mobile .hero-stats{position:static;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px;border-radius:24px 24px 0 0;padding:16px 10px}
.hero.hero-mobile .hero-stat{padding:0 8px;gap:8px}.hero.hero-mobile .hero-stat:nth-child(3){border-left:0}.hero.hero-mobile .hero-stat svg{width:26px;height:26px}.hero.hero-mobile .hero-stat b{font-size:19px}
